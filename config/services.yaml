parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\HospitalmapService:
        arguments:
            $apiKey: '%env(GEOAPIFY_API_KEY)%'

    App\Service\ChatbotService:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY)%'