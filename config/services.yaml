# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    stripe_publishable_key: '%env(default::STRIPE_PUBLISHABLE_KEY)%'
    stripe_currency_default: 'eur'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Livraison : injection des variables d'environnement
    App\Service\Shipping\DistanceService:
        arguments:
            $apiKey: '%env(OPENROUTE_API_KEY)%'
            $warehouseAddress: '%env(SHIPPING_WAREHOUSE_ADDRESS)%'

    App\Service\Shipping\DhlQuoteClient:
        arguments:
            $baseUrl: '%env(DHL_API_BASE_URL)%'
            $accountNumber: '%env(DHL_ACCOUNT_NUMBER)%'
            $username: '%env(DHL_USERNAME)%'
            $password: '%env(DHL_PASSWORD)%'

    App\Service\Shipping\AramexQuoteClient:
        arguments:
            $enabled: '%env(bool:ARAMEX_ENABLED)%'
            $accountNumber: '%env(ARAMEX_ACCOUNT_NUMBER)%'
            $username: '%env(ARAMEX_USERNAME)%'
            $password: '%env(ARAMEX_PASSWORD)%'
            $rateUrl: '%env(ARAMEX_RATE_URL)%'

    App\Service\NotificationService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Service\PaymentService:
        arguments:
            $secretKey: '%env(default::STRIPE_SECRET_KEY)%'
            $webhookSecret: '%env(default::STRIPE_WEBHOOK_SECRET)%'
            $currency: '%env(default:stripe_currency_default:STRIPE_CURRENCY)%'
            $tndToEurRate: '%env(float:STRIPE_TND_TO_EUR)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
